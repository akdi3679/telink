name: Flutter Android Build + Appetize Upload

on:
  push:
    branches: [main]
    paths:
      - 'telink_app/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: telink_app
        run: flutter pub get

      - name: Analyze
        working-directory: telink_app
        run: flutter analyze

      - name: Run tests
        working-directory: telink_app
        run: flutter test

      - name: Build release APKs (split per ABI)
        working-directory: telink_app
        run: flutter build apk --release --split-per-abi --dart-define=API_URL=https://236af602938955.lhr.life

      - name: List APKs
        working-directory: telink_app
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload to Appetize
        id: appetize
        uses: appetizeio/github-action-appetize@v1.0.5
        with:
          apiToken: ${{ secrets.APPETIZE_TOKEN }}
          appFile: telink_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          platform: 'android'

      - name: Print stream URL
        run: |
          echo "════════════════════════════════════════"
          echo "  YOUR APP IS LIVE ON APPETIZE"
          echo "════════════════════════════════════════"
          echo ""
          echo "  Stream URL:"
          echo "  https://appetize.io/app/${{ steps.appetize.outputs.publicKey }}"
          echo ""
          echo "  Open this URL in SRWare Iron."
          echo "  The emulator starts in ~15 seconds."
          echo ""
          echo "════════════════════════════════════════"
