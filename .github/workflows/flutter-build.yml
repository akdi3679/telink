name: Flutter Android Build

on:
  push:
    branches: [main]
    paths:
      - 'telink_app/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: telink_app
        run: flutter pub get

      - name: Analyze
        working-directory: telink_app
        run: flutter analyze

      - name: Run tests
        working-directory: telink_app
        run: flutter test

      - name: Build debug APKs (split per ABI)
        working-directory: telink_app
        run: flutter build apk --release --split-per-abi --dart-define=API_URL=https://2bdb-102-159-226-182.ngrok-free.app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telink-debug-apk
          path: telink_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30